
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Task Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1>Daily Task Planner</h1>
            <p id="currentDate"></p>
        </div>

        <div class="card p-4">

            <form id="taskForm" class="d-flex gap-2">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Enter a task"
                >

                <button type="submit" class="btn btn-primary">
                    Add
                </button>
            </form>

            <div class="d-flex justify-content-center gap-2 my-4">
                <button class="btn btn-outline-primary filter-btn" data-filter="all">
                    All
                </button>

                <button class="btn btn-outline-secondary filter-btn" data-filter="pending">
                    Pending
                </button>

                <button class="btn btn-outline-success filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <div id="taskList"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
